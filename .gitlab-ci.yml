variables:
  GIT_SUBMODULE_STRATEGY: recursive
  GIT_STRATEGY: clone

stages:
  - test
  - fw_test
  - publish


###################################################################################################
# Job trigger policy
#
# Declared once and shared via `extends:` so it cannot drift between jobs.
# A job with neither `rules:` nor `only:` defaults to `only: [branches, tags]`,
# which is excluded from merge request pipelines -- that is how `unit_tests`
# silently stopped running in MRs while every other job opted in by hand.
#
# `github_mirror` is deliberately NOT covered here; it keeps its own
# `only: - public` trigger.
###################################################################################################
.mr_and_default_branch:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH


###################################################################################################
# Build
###################################################################################################
build_sdk_umc55:
  extends: .mr_and_default_branch
  stage: test
  tags:
    - shell
  script:
    - source ./setup_env
    - cd examples/demo_umc55
    - ./build.sh

  artifacts:
    paths:
      - examples/demo_umc55/build/libtassic_sdk.a


###################################################################################################
# Unit tests (Ceedling/CMock)
# Compiled and run on the host (no RISC-V toolchain required).
###################################################################################################
unit_tests:
  extends: .mr_and_default_branch
  stage: test
  tags:
    - shell
  script:
    - |
      source setup_env
      cd tests
      ceedling clobber  # deletes old data
      ceedling test:all


###################################################################################################
# Static analysis (CodeChecker)
#
# `CodeChecker check` exits 2 when any finding is reported. The wrapper's
# `--gen-reports` mode exports both reports, then returns that status as the
# job result so findings remain the quality gate.
#
# The Code Climate JSON is consumed by GitLab's `reports.codequality`
# artifact, which surfaces findings inline on the MR diff. `when: always`
# uploads both artifacts on failed runs so reviewers can inspect findings
# from the MR page.
###################################################################################################
static_analysis:
  extends: .mr_and_default_branch
  stage: test
  tags:
    - shell
  script:
    - source ./setup_env
    - ./scripts/codechecker/codechecker_run.sh --gen-reports
  artifacts:
    when: always
    paths:
      - .codechecker/reports_html
    reports:
      codequality: .codechecker/reports.json
    expire_in: 2 weeks


###################################################################################################
# Verify the committed lib-nonpublic binaries match the source commit
# recorded in bin/lib-nonpublic.manifest. Re-clones the lib-nonpublic
# repo at that commit, rebuilds, and diffs the working tree — any change
# means the committed binaries do not match the recorded source.
#
# Access:
#   - TS_LIB_NONPUBLIC_REPO_URL (CI/CD variable) is an HTTPS URL with
#     ${CI_JOB_TOKEN} embedded. GitLab expands the token at job runtime
#     (the variable has Expand = true), so no long-lived credential is
#     stored anywhere.
#   - The lib-nonpublic project must allowlist this project's
#     CI_JOB_TOKEN: in the lib-nonpublic project go to Settings >
#     CI/CD > Job token permissions and add `ts-tr01-sdk` to the
#     allowlist. Without this the clone fails with
#     "project not found or no permission".
#   - For local invocation, developers set TS_LIB_NONPUBLIC_REPO_URL
#     in their own environment (typically an ssh:// URL using their
#     own credentials).
###################################################################################################
verify_lib_nonpublic_binaries:
  extends: .mr_and_default_branch
  stage: test
  tags:
    - shell
  script:
    - source ./setup_env
    - 'test -f bin/lib-nonpublic.manifest || { echo "ERROR - bin/lib-nonpublic.manifest missing; run build_lib_nonpublic.sh and commit the result." >&2; exit 1; }'
    - ./build_lib_nonpublic.sh --yes
    - git checkout -- bin/lib-nonpublic.manifest
    - 'git diff --stat --exit-code || { echo "ERROR - committed lib-nonpublic binaries do not match the commit recorded in bin/lib-nonpublic.manifest." >&2; exit 1; }'


