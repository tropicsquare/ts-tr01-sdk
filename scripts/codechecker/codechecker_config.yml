analyzer:
    ################################################
    # Configure skipfile to select which sources
    # to check.
    ################################################
    - --skip=scripts/codechecker/codechecker.skip

    ################################################
    # Enable / disable checks
    #
    # NOTE: This is an intentionally minimal starting set that is expected
    # to pass on the current codebase. New profiles / checks (sensitive,
    # portability, optin.*, alpha.*, bugprone-*, cert-*, etc.) should be
    # added incrementally as the code is cleaned up. See README.md,
    # section "Static code analysis".
    ################################################
    - --enable=profile:security

    # The reserved-identifier diagnostics flag the common `_PRIVATE_MACRO`
    # idiom used throughout this codebase. They must be disabled at the
    # CodeChecker layer (`--disable=...`) because disabling them only via
    # the clang-tidy Checks string is overridden by profile:security.
    - --disable=clang-diagnostic-reserved-identifier
    - --disable=clang-diagnostic-reserved-macro-identifier

    # `-Wswitch-enum` requires every enum value to appear as an explicit
    # `case`, even when a `default:` is present. Our enums use the `_NUM`
    # sentinel pattern (e.g. gpo_e::GPO_NUM as a size limit) which is not
    # meaningful to switch on. The standard `clang-diagnostic-switch`
    # check stays enabled and still catches missing values without a default.
    - --disable=clang-diagnostic-switch-enum

    # Recommends C11 Annex K functions (memcpy_s, memset_s) which are not
    # provided by the freestanding RISC-V toolchain we build against, so
    # the suggested fix is not available. Not actionable.
    # Disabled at the CodeChecker layer for clangsa, *and* via the
    # clang-tidy Checks string below as `-clang-analyzer-...` because
    # CodeChecker's --disable does not propagate to clang-tidy's
    # clang-analyzer-* integration.
    - --disable=security.insecureAPI.DeprecatedOrUnsafeBufferHandling

    # Experimental (alpha.*) checker; known to produce false positives on
    # intentional buffer-reuse patterns (e.g. SHA-256 message scheduler
    # writing past the end of `buf` by design). Both the V1 and V2 checker
    # names are listed because the runner's CodeChecker version may use
    # either depending on which is enabled. Revisit once promoted out of
    # alpha or per-finding triage.
    - --disable=alpha.security.ArrayBound
    - --disable=alpha.security.ArrayBoundV2

    # Experimental (alpha.*) checker, LOW severity. Flags any pointer
    # arithmetic on non-array-typed pointers; this is common and safe in
    # driver code that walks memory-mapped register layouts. Revisit once
    # promoted out of alpha.
    - --disable=alpha.core.PointerArithm

    # Flags casts to enum where the integer value is not a named enum
    # member. Fires on the very common bitmask-flag-enum pattern used
    # throughout the SDK (e.g. timer_irq_e where TIMER_OVERFLOW_INTERRUPT
    # | TIMER_THRESHOLD_INTERRUPT yields 3, not a member). The clangsa
    # path is disabled here; the clang-tidy report path is disabled via
    # the Checks string below.
    - --disable=optin.core.EnumCastOutOfRange

    ################################################
    # Cross Translation Unit analysis
    ################################################
    - --ctu-all

    ################################################
    # Export setup
    ################################################
    - --output=.codechecker/reports

    ################################################
    # Analyzer configs
    ################################################
    # clang-tidy: start with just clang-analyzer-* and clang-diagnostic-*.
    # Specific diagnostics are suppressed via `--disable=...` above
    # (which also takes effect when profile:security re-enables them).
    # The two `-clang-analyzer-...` negations below mirror the CodeChecker
    # --disable= entries — they are needed because CodeChecker's --disable
    # does not propagate to clang-tidy's clang-analyzer-* integration, so
    # the same checker would otherwise still be reported via that path.
    - --analyzer-config=clang-tidy:Checks=clang-analyzer-*,clang-diagnostic-*,-clang-analyzer-security.insecureAPI.DeprecatedOrUnsafeBufferHandling,-clang-analyzer-optin.core.EnumCastOutOfRange

    ################################################
    # Misc configuration
    ################################################
    # Clean output directory and generate all reports again instead of just overwriting existing
    # ones. This is useful when e.g. changing CodeChecker configuration.
    - --clean
